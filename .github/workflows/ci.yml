name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile Python files
        run: python -m compileall -q src tests

      - name: Test
        run: python -m pytest -q -m "not aiohttp" --disable-warnings

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Import smoke test
        run: |
          python - <<'PY'
          from apifreaks import ApifreaksApi, AsyncApifreaksApi
          from apifreaks.environment import ApifreaksApiEnvironment

          assert ApifreaksApi is not None
          assert AsyncApifreaksApi is not None
          assert ApifreaksApiEnvironment.DEFAULT.value == "https://api.apifreaks.com"
          PY