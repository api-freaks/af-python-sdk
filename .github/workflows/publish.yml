name: Publish to PyPI

on:
  push:
    tags:
      - "v*"   # triggers on tags like v1.1.0, v2.0.0, etc.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bootstrap Poetry
        run: curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1

      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"   # strips the leading "v" -> 1.1.0
          echo "Publishing version $TAG"
          poetry version "$TAG"

      - name: Install dependencies
        run: poetry install

      - name: Build and publish to PyPI
        run: poetry publish --build --no-interaction
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
