[tool.poetry]
name = "apifreaks"
version = "2.0.0"
description = "Official Python SDK for the Apifreaks API platform."
readme = "README.md"
authors = ["Apifreaks <support@apifreaks.com>"]
keywords = [
    "apifreaks",
    "api",
    "sdk",
    "ip-geolocation",
    "whois",
    "dns",
    "ssl",
    "email-validation",
    "phone-validation",
    "pdf",
    "web-scraping",
    "ocr",
    "timezone",
    "currency",
    "vat",
    "user-agent",
    "weather"
]

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]

packages = [
    { include = "apifreaks", from = "src" }
]

[tool.poetry.urls]
Repository = "https://github.com/api-freaks/af-python-sdk"

[tool.poetry.dependencies]
python = "^3.10"
httpx = ">=0.21.2"
pydantic = [
    { version = ">=1.9.2", python = "<3.15" },
    { version = ">=2.14.0", python = ">=3.15" }
]
typing_extensions = ">=4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.5"
python-dateutil = "^2.9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"