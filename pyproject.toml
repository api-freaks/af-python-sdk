[project]
name = "apifreaks"
version = "0.1.0"
description = "Python SDK for APIFreaks APIs"
requires-python = ">=3.8"
dependencies = [
  "httpx>=0.21.2",
  "pydantic>=1.9.2",
  "typing_extensions>=4.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
